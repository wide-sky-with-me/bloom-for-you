name: Publish Bloom for You Scroll World

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vite & Babylon/Havok dependencies
        run: npm ci
      - name: Build Vite web bundle & standalone HTML
        run: npm run build
      - name: Run release contract tests
        run: python -m unittest discover -s tests -v
      - name: Build static site
        env:
          BLOOM_BUILD_REVISION: ${{ github.sha }}
        run: python build.py --output dist
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Scroll World
        id: deployment
        uses: actions/deploy-pages@v4
