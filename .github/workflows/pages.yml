name: Publish Iris Bay

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Vite & Babylon.js dependencies
        run: npm ci
      - name: Build Vite web bundle & standalone HTML
        run: npm run build
      - name: Run release contract tests
        run: python -m unittest discover -s tests -v
      - name: Validate flower path geometry
        run: python desktop/Tests/test_scene.py
      - name: Build the playable world at the original URL
        run: |
          npm run build:web -- --mode remodel --outDir "$PWD/pages"
          mkdir -p pages/classic pages/flower-path
          node desktop/Viewer/build.mjs desktop/Art pages/flower-path/index.html
          cp '鸢尾湾·花与海之约.html' pages/classic/index.html
          cp THIRD_PARTY_NOTICES.md pages/credits.txt
          python desktop/WebRemodel/check_pages.py pages
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: pages
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Iris Bay
        id: deployment
        uses: actions/deploy-pages@v4
