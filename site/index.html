<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040b1e">
  <meta name="description" content="梵高星月夜与繁花满天星秘境 — Three.js + p5.js 沉浸式油画星空、六大立体花丛与隐藏爱的告白彩蛋。">
  <title>梵高星月夜 · 繁花与满天星告白秘境</title>
  <link rel="icon" href="./assets/flower.svg" type="image/svg+xml">
  <link rel="preload" href="./assets/flower-song.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
  <script src="./vendor/p5-1.9.4/p5.min.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "./vendor/three-0.186.1/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="app-shell" class="app-shell" data-ready="false">
    <!-- Upper Realm: p5.js Van Gogh Starry Night & Starry Motes -->
    <div id="sky-container" class="sky-container" aria-hidden="true"></div>

    <!-- Lower Realm: Three.js 3D Multi-Species Flower Meadow -->
    <canvas id="meadow-canvas" class="meadow-canvas" aria-label="梵高星夜与繁花满天星交互花丛"></canvas>

    <!-- 3D-Projected Interactive Easter Egg Beacons -->
    <div id="egg-markers" class="egg-markers" aria-label="花丛与星河中的隐藏告白彩蛋"></div>

    <!-- Top Floating HUD -->
    <header class="hud-top">
      <div class="brand-badge">
        <span class="brand-dot" aria-hidden="true"></span>
        <div class="brand-copy">
          <p class="brand-kicker" id="brand-kicker">VAN GOGH STARRY NIGHT &amp; FLOWER MEADOW</p>
          <h1 class="brand-title" id="brand-title">梵高星月夜 · 繁花与满天星秘境</h1>
        </div>
      </div>

      <div class="hud-actions">
        <button id="btn-audio" class="hud-pill hud-btn" type="button" aria-pressed="false" title="开启或关闭星夜八音盒">
          <span class="pill-icon" aria-hidden="true">♪</span>
          <span id="audio-label">星夜八音盒</span>
        </button>

        <button id="btn-meteor" class="hud-pill hud-btn" type="button" title="划破梵高星夜，召唤许愿流星">
          <span class="pill-icon" aria-hidden="true">彡</span>
          <span>召唤流星</span>
        </button>

        <button id="btn-letter" class="hud-pill hud-btn hud-btn--rose" type="button" title="展读完整告白信笺">
          <span class="pill-icon" aria-hidden="true">✉</span>
          <span>爱的信笺</span>
        </button>

        <button id="btn-collection" class="hud-pill hud-counter" type="button" aria-expanded="false" title="查看已寻获的告白彩蛋">
          <span class="counter-star" aria-hidden="true">✦</span>
          <span class="counter-label">已寻获心意</span>
          <strong id="counter-value" class="counter-value">0 / 5</strong>
        </button>
      </div>
    </header>

    <!-- Bottom Guidance & Flower Species Quick-Discover Bar -->
    <div class="hud-bottom">
      <div id="hint-banner" class="hint-banner" role="status" aria-live="polite">
        <span class="hint-sparkle" aria-hidden="true">✧</span>
        <span id="hint-text">指尖拨开无尽夏、向日葵、鸢尾、玫瑰、郁金香与满天星花丛，寻觅 5 处发光的爱的告白彩蛋</span>
      </div>

      <nav id="egg-quick-nav" class="egg-quick-nav" aria-label="繁花与星河心意寻宝快捷导航"></nav>
    </div>

    <!-- Confession Reading Modal (Frosted Midnight Glass Card) -->
    <aside id="confession-modal" class="confession-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="card-title">
      <div id="modal-backdrop" class="modal-backdrop"></div>
      <article class="confession-card" data-accent="gold">
        <button id="btn-close-card" class="card-close" type="button" aria-label="关闭告白卡片">×</button>

        <div class="card-header">
          <span id="card-badge" class="card-badge">彩蛋 I · 发光无尽夏与满天星</span>
          <p id="card-subtitle" class="card-subtitle">无尽夏的蓝与满天星的白，是我第一眼望见你时的心跳</p>
          <h2 id="card-title" class="card-title">初遇 · 星河落进花丛</h2>
        </div>

        <div id="card-Divider" class="card-divider" aria-hidden="true">
          <span>✦</span>
        </div>

        <div id="card-body" class="card-body"></div>

        <footer class="card-footer">
          <div class="card-quote-wrap">
            <p id="card-quote" class="card-quote"></p>
            <p id="card-signature" class="card-signature"></p>
          </div>
          <div class="card-actions">
            <button id="btn-next-egg" class="card-action-btn card-action-btn--primary" type="button">
              <span>继续寻觅下一处花间心意</span>
            </button>
          </div>
        </footer>
      </article>
    </aside>

    <!-- Collection Drawer -->
    <aside id="collection-drawer" class="collection-drawer" aria-hidden="true" aria-label="已收集的爱的告白列表">
      <div class="drawer-header">
        <div>
          <p class="drawer-kicker">STARRY NIGHT &amp; FLOWER CONFESSIONS</p>
          <h2 class="drawer-title">繁花与星河心意手账</h2>
        </div>
        <button id="btn-close-drawer" class="drawer-close" type="button" aria-label="关闭手账">×</button>
      </div>
      <p class="drawer-desc">点击任意花间或星河彩蛋即可重温告白；寻获全部 5 处心意后，将唤醒梵高星夜终章盛放。</p>
      <ul id="drawer-list" class="drawer-list"></ul>
      <div class="drawer-footer">
        <button id="btn-finale-preview" class="drawer-finale-btn" type="button">
          <span>✦ 绽放终章 · 漫天星河与人间繁花皆为你盛开</span>
        </button>
      </div>
    </aside>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
