<style>
:root {color-scheme:light;--ink:#244940;--paper:#e9f0eb;--soft:#486259;--edge:#a6bdb0;--iris:#68608b;--field:#f7faf7}
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font:15px/1.5 "Microsoft YaHei UI","PingFang SC",system-ui,sans-serif}

.heading,.controls,label{display:flex;align-items:center}.heading{gap:12px}.heading svg{height:38px;width:36px;color:var(--iris)}h1{margin:0;white-space:nowrap;font:500 clamp(20px,2vw,29px)/1.3 "Songti SC","Noto Serif CJK SC",SimSun,serif;letter-spacing:.08em}.controls{gap:8px}label{gap:10px;font-size:14px;color:var(--soft)}select,button{font:inherit;border:1px solid var(--edge);border-radius:4px;height:40px;background:var(--field);color:var(--ink);cursor:pointer}select{min-width:140px;padding:0 10px}button{padding:0 12px}button:active{transform:translateY(1px)}button:disabled,select:disabled{cursor:wait;opacity:.56}.hint{margin:0;font-size:13px;color:var(--soft)}.touch{display:none}
@media(hover:hover){button:not(:disabled):hover,select:not(:disabled):hover{border-color:var(--ink)}}@media(pointer:coarse){select,button{height:44px}.mouse{display:none}.touch{display:inline}}@media(max-width:780px){footer{gap:10px 20px;flex-wrap:wrap}.hint{width:100%}}@media(max-width:520px){footer{padding:10px 14px;gap:8px 0}.heading{width:100%;gap:8px}.heading svg{width:25px;height:25px}.controls{width:100%;justify-content:space-between}.hint{font-size:12px}select{font-size:16px}}
footer{display:grid;grid-template-columns:auto 1fr auto;gap:12px 24px;padding:12px clamp(14px,2.5vw,40px)}.controls,.extras,.steps{display:flex;gap:8px;align-items:center}.steps[hidden],#replay[hidden]{display:none}.controls{justify-self:center;flex-wrap:wrap}.steps{border-left:1px solid var(--edge);padding-left:10px}.extras{align-items:flex-end;flex-direction:column;gap:3px}.extras label{font-size:13px;cursor:pointer;gap:5px}.extras input{accent-color:var(--ink)}#ahead,#replay{background:var(--ink);color:var(--field);border-color:var(--ink)}.steps button:disabled{cursor:default;opacity:.48}select{min-width:118px}#phase{color:var(--iris);font-size:12px}#phase:empty{display:none}
@media(max-width:1020px){footer{grid-template-columns:1fr auto}.controls{grid-row:2;grid-column:1/-1;justify-self:start}.extras{grid-row:1;grid-column:2}.hint{width:auto}.heading{width:auto}}@media(max-width:520px){footer{display:flex;align-items:center;gap:6px 12px}.heading{flex:1}.heading svg{display:none}.extras{order:0;flex-direction:row;align-items:center}.extras .hint{display:none}.controls{order:1;gap:6px;justify-content:flex-start}.steps{border:0;padding:0}.controls label{gap:5px}.controls button{padding:0 9px}.extras label{min-height:32px}}
